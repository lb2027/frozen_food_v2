<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Management - BINTANG JAYA</title>
    <link rel="stylesheet" href="../foundation.css" />
    <link rel="stylesheet" href="staff_manage.css" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="sidebar">
      <div class="logo">BINTANG<br />JAYA</div>
      <a href="/dashboard_owner/owner.html">
        <div class="sidebar-item">
          <div class="icon-circle">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <line x1="3" y1="9" x2="21" y2="9" />
              <line x1="9" y1="21" x2="9" y2="9" />
            </svg>
          </div>
          <span>Dashboard</span>
        </div>
      </a>
      <a href="/dashboard_owner/history/history.html">
        <div class="sidebar-item">
          <div class="icon-circle">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </div>
          <span>Riwayat</span>
        </div>
      </a>
      <div class="sidebar-item active">
        <div class="icon-circle">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
        <span>Staff</span>
      </div>
      <a href="/dashboard_owner/reports/reports.html">
        <div class="sidebar-item">
          <div class="icon-circle">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            </svg>
          </div>
          <span>Reports</span>
        </div>
      </a>
      <!-- Add this after Reports in the sidebar -->
      <a href="/invoice/invoice.html">
        <div class="sidebar-item">
          <div class="icon-circle">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
              <polyline points="10 9 9 9 8 9" />
            </svg>
          </div>
          <span>Invoice</span>
        </div>
      </a>
      <div class="sidebar-item" style="margin-top: auto">
        <div class="icon-circle">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </div>
        <span>Logout</span>
      </div>
    </div>

    <div class="main-content">
      <div class="header">
        <div class="back-button">
          <span class="material-icons">chevron_left</span>
          <span>Staff Management</span>
        </div>
        <div class="user-info">
          <div class="notification">
            <span class="material-icons">notifications</span>
          </div>
        </div>
      </div>

      <div class="container">
        <div class="tabs-container">
          <div class="tab active">Staff Management</div>
          <div class="tab">Attendance</div>
          <div class="tab">Payroll</div>
        </div>

        <!-- Update the subheader section with filter dropdowns -->
        <div class="subheader">
          <div class="title-container">
            <h2 class="staff-count">Staff (0)</h2>
          </div>
          <div class="filter-group">
            <select class="filter-select" title="Filter by status">
              <option value="">✓ All Status</option>
              <option value="Owner">Owner</option>
              <option value="Manager">Manager</option>
              <option value="Staff">Staff</option>
              <option value="Kasir">Kasir</option>
            </select>
            <select class="filter-select" title="Filter by date">
              <option value="">✓ All Time</option>
              <option value="today">Today</option>
              <option value="yesterday">Yesterday</option>
              <option value="week">Last 7 Days</option>
              <option value="month">Last 30 Days</option>
            </select>
          </div>
          <div class="actions">
            <button class="sort-btn">
              <span class="material-icons">sort</span>
              <span>Sort</span>
            </button>
            <button class="add-staff-btn">
              <span class="material-icons">add</span>
              <span>Add Staff</span>
            </button>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th width="40">
                  <div class="checkbox-container">
                    <span class="custom-checkbox"></span>
                  </div>
                </th>
                <th width="80">ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th width="80">Age</th>
                <th width="120">Salary</th>
                <th width="100">Status</th>
                <th width="120">Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- Table rows will be populated by JavaScript -->
            </tbody>
          </table>
          <div class="no-data-message">No staff data available.</div>
        </div>
      </div>
    </div>

    <!-- Loading overlay -->
    <div class="loader">
      <div class="spinner"></div>
    </div>

    <script src="staff_manage.js"></script>
  </body>
</html>
