<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Bintang Jaya</title>
    <link rel="stylesheet" href="/register/register.css" />
  </head>
  <body>
    <div class="logo">Bintang Jaya</div>

    <div class="container">
      <h1>Register</h1>
      <p class="register-subtitle">
        Please fill in the details below to create your account
      </p>

      <form id="register-form">
        <!-- Account Information - Full width -->
        <div class="form-row">
          <div class="form-group col-full">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              class="form-control"
              placeholder="Enter username"
              required
            />
          </div>
        </div>

        <!-- Password fields - Two columns -->
        <div class="form-row">
          <div class="form-group col-half">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Enter password"
              required
            />
          </div>
          <div class="form-group col-half">
            <label for="confirm-password">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              class="form-control"
              placeholder="Confirm password"
              required
            />
            <div class="error-message" id="password-error">
              Passwords do not match
            </div>
          </div>
        </div>

        <!-- Personal Information - Two columns -->
        <div class="form-row">
          <div class="form-group col-half">
            <label for="nama">Full Name</label>
            <input
              type="text"
              id="nama"
              class="form-control"
              placeholder="Enter your full name"
              required
            />
          </div>
          <div class="form-group col-half">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="Enter email"
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-half">
            <label for="no_hp">Phone Number</label>
            <input
              type="text"
              id="no_hp"
              class="form-control"
              placeholder="Enter phone number"
              required
            />
          </div>
          <div class="form-group col-half">
            <label for="tanggal_lahir">Date of Birth</label>
            <input type="date" id="tanggal_lahir" class="form-control" />
          </div>
        </div>

        <!-- Address - Full width -->
        <div class="form-row">
          <div class="form-group col-full">
            <label for="alamat">Address</label>
            <textarea
              id="alamat"
              class="form-control"
              placeholder="Enter address"
              rows="2"
            ></textarea>
          </div>
        </div>

        <div class="error-message" id="register-error">
          Registration failed. Please try again.
        </div>
        <button type="submit" class="btn" id="register-btn">Register</button>
      </form>
      <div class="form-footer">
        Already have an account? <a href="/login/login.html">Login</a>
      </div>
    </div>

    <script src="/register/register.js"></script>
  </body>
</html>
